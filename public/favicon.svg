<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Computadora pixelada</title>

  <!-- Contorno del monitor -->
  <rect x="1" y="1" width="14" height="11" fill="#2b2d42"/>
  <!-- Carcasa -->
  <rect x="2" y="2" width="12" height="9" fill="#e9dfc7"/>
  <!-- Pantalla -->
  <rect x="3" y="3" width="10" height="6" fill="#14213d"/>

  <!-- Texto en pantalla: ">_" -->
  <rect x="4" y="4" width="1" height="1" fill="#4ade80"/>
  <rect x="5" y="5" width="1" height="1" fill="#4ade80"/>
  <rect x="4" y="6" width="1" height="1" fill="#4ade80"/>
  <rect x="7" y="6" width="2" height="1" fill="#4ade80"/>

  <!-- LED y botón -->
  <rect x="11" y="9" width="1" height="1" fill="#4ade80"/>
  <rect x="12" y="9" width="1" height="1" fill="#8d99ae"/>

  <!-- Cuello -->
  <rect x="6" y="12" width="4" height="1" fill="#2b2d42"/>
  <rect x="7" y="12" width="2" height="1" fill="#e9dfc7"/>

  <!-- Base -->
  <rect x="3" y="13" width="10" height="2" fill="#2b2d42"/>
  <rect x="4" y="13" width="8" height="1" fill="#e9dfc7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
